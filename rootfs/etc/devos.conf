# DEVos default configuration

# Boot mode options:
#   1 = Pocket VPS (headless Linux server, USB-RNDIS, SSH)
#   2 = Wi-Fi Router (AP hotspot, DHCP gateway, NAT routing)
#   3 = Dual Mode (Pocket VPS + Wi-Fi Router combined)
#   4 = Regular Barebones (Stock Android, full phone hardware active)
DEVOS_DEFAULT_MODE=4

# Timeout in seconds before auto-booting DEVOS_DEFAULT_MODE
DEVOS_BOOT_TIMEOUT=5

# Pocket VPS network settings
DEVOS_VPS_IP=192.168.7.2
DEVOS_VPS_NETMASK=255.255.255.0
DEVOS_VPS_HOST_IP=192.168.7.1
DEVOS_SSH_PORT=22

# Wi-Fi Router network settings
DEVOS_ROUTER_IP=192.168.43.1
DEVOS_ROUTER_NETMASK=255.255.255.0
DEVOS_DHCP_START=192.168.43.100
DEVOS_DHCP_END=192.168.43.200
