stages:
  - build

default:
  image: python:3.12-slim
  before_script:
    - apt-get update --quiet
    - apt-get install --quiet --yes --no-install-recommends genisoimage cpio gzip

build-initramfs:
  stage: build
  script:
    - python3 scripts/build_initramfs.py
    - gzip -t builds/devos-rmx3231-initramfs.cpio.gz
    - gzip -dc builds/devos-rmx3231-initramfs.cpio.gz | cpio -it >/dev/null
    - python3 -m unittest discover -s tests -p "test_*.py" -v
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - builds/devos-rmx3231-initramfs.cpio.gz
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_PIPELINE_SOURCE == "web"

build-boot-candidate:
  stage: build
  when: manual
  allow_failure: true
  script:
    - |
      if [ -z "${STOCK_BOOT_URL:-}" ] || [ -z "${STOCK_BOOT_SHA256:-}" ]; then
        echo "Set STOCK_BOOT_URL and STOCK_BOOT_SHA256 pipeline variables before running this job."
        exit 1
      fi
    - |
      python3 - <<'PY'
      import hashlib
      import os
      import pathlib
      import re
      import urllib.parse
      import urllib.request

      url = os.environ["STOCK_BOOT_URL"]
      expected = os.environ["STOCK_BOOT_SHA256"].lower()
      if urllib.parse.urlparse(url).scheme != "https":
          raise SystemExit("stock_boot_url must use HTTPS")
      if not re.fullmatch(r"[0-9a-f]{64}", expected):
          raise SystemExit("stock_boot_sha256 must be a 64-character hex digest")

      destination = pathlib.Path("firmware/extracted/boot/boot.img")
      destination.parent.mkdir(parents=True, exist_ok=True)
      temporary = destination.with_suffix(".img.part")
      request = urllib.request.Request(
          url,
          headers={"User-Agent": "DEVos-GitLab-CI/1"},
      )
      digest = hashlib.sha256()
      with urllib.request.urlopen(request, timeout=120) as response:
          with temporary.open("wb") as output:
              while block := response.read(1024 * 1024):
                  output.write(block)
                  digest.update(block)
      actual = digest.hexdigest()
      if actual != expected:
          temporary.unlink(missing_ok=True)
          raise SystemExit(
              f"BOOT image SHA-256 mismatch: expected {expected}, received {actual}"
          )
      temporary.replace(destination)
      print(f"Verified stock BOOT image: {actual}")
      PY
    - python3 scripts/build_initramfs.py
    - python3 scripts/build_boot_image.py
    - python3 scripts/inspect_android_boot.py builds/devos-rmx3231-a119-boot-custom-avb.img
    - python3 scripts/build_flashable_package.py
    - python3 -m unittest discover -s tests -p "test_*.py" -v
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - builds/devos-rmx3231-installer.iso
      - builds/devos-rmx3231-installer.iso.sha256
      - builds/devos-rmx3231-flashable.zip
      - builds/devos-rmx3231-flashable.zip.sha256
      - builds/devos-rmx3231-a119-boot-custom-avb.img
      - builds/devos-rmx3231-a119-boot-custom-avb.img.json
      - builds/devos-rmx3231-a119-boot-custom-avb.img.avbpubkey.bin
      - builds/devos-rmx3231-initramfs.cpio.gz
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
